<title>Plate Loader — algorithm tests (local only)</title>
<meta name="robots" content="noindex"/>
<style>
  body { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; background: #0e0f12; color: #e9eaee; max-width: 1100px; margin: 24px auto; padding: 0 16px 60px; }
  h1, h2, h3 { font-family: 'Bebas Neue', sans-serif; letter-spacing: 0.06em; color: #fff; }
  h1 { font-size: 28px; border-bottom: 1px solid #2a2e38; padding-bottom: 8px; }
  h2 { font-size: 18px; margin-top: 24px; color: #ff5b1f; }
  .case { background: #16181d; border: 1px solid #2a2e38; border-radius: 6px; padding: 12px 14px; margin-top: 12px; }
  .seq { color: #8a8f9c; font-size: 13px; margin-bottom: 8px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 12px; }
  .mode { background: #1c1f26; border: 1px solid #2a2e38; border-radius: 4px; padding: 8px 10px; font-size: 12px; }
  .mode .name { color: #ff5b1f; font-weight: 700; margin-bottom: 4px; }
  .mode pre { margin: 4px 0; white-space: pre-wrap; color: #c9ccd3; font-size: 11px; line-height: 1.45; }
  .pass { color: #6cd16c; }
  .fail { color: #ff5252; }
  .info { color: #f3c04a; }
  .divergent { background: rgba(108,209,108,0.08); border-color: #6cd16c; }
  .converged { background: rgba(243,192,74,0.06); }
  .total { display: flex; gap: 14px; color: #8a8f9c; margin-top: 6px; font-size: 11px; }
  .total b { color: #e9eaee; }
  a { color: #ff5b1f; }
</style>
</head>
<body>
<h1>Plate Loader — algorithm tests</h1>
<p style="color:#8a8f9c;font-size:13px;">Verifies the three optimisation modes (<code>count</code>, <code>kg</code>, <code>sqrt</code>) produce sensible — and in some cases distinct — plate compositions. <a href="/app/plateloader">← back to app</a></p>
<div id="out"></div>

<script src="algo.js"></script>
<script>
'use strict';

// buildAlgoLib is loaded from algo.js above.

const PLATES = [
  { kg: 25,   label: '25'   },
  { kg: 20,   label: '20'   },
  { kg: 15,   label: '15'   },
  { kg: 10,   label: '10'   },
  { kg: 5,    label: '5'    },
  { kg: 2.5,  label: '2.5'  },
  { kg: 1.25, label: '1.25' },
];
const algoLib = buildAlgoLib();

// ----- helpers -----
function stackToCountSummary(counts) {
  const parts = [];
  for (let i = 0; i < counts.length; i++) if (counts[i] > 0) parts.push(`${counts[i]}×${PLATES[i].label}`);
  return parts.length ? parts.join(' + ') : 'bar only';
}

function pathSignature(results) {
  // Each set's count multiset, joined into a compact string.
  return results.map(r => r.valid ? r.counts.join('.') : `INV(${r.total})`).join(' | ');
}

function totalMoves(results, prevStack = []) {
  // count plate moves (both sides) and total kg moved
  let moves = 0, kg = 0, sqrtKg = 0;
  let cur = prevStack;
  for (const r of results) {
    if (!r.valid) { cur = []; continue; }
    let i = 0;
    while (i < cur.length && i < r.stack.length && cur[i] === r.stack[i]) i++;
    const removed = cur.slice(i), added = r.stack.slice(i);
    moves += (removed.length + added.length) * 2;
    for (const k of removed) { kg += PLATES[k].kg * 2; sqrtKg += Math.sqrt(PLATES[k].kg) * 2; }
    for (const k of added)   { kg += PLATES[k].kg * 2; sqrtKg += Math.sqrt(PLATES[k].kg) * 2; }
    cur = r.stack;
  }
  // Cleanup at the very end (unload remaining)
  if (cur.length) {
    moves += cur.length * 2;
    for (const k of cur) { kg += PLATES[k].kg * 2; sqrtKg += Math.sqrt(PLATES[k].kg) * 2; }
  }
  return { moves, kg, sqrtKg };
}

// ----- search for mode-divergent inputs -----
// Brute-force tries short sequences and reports any where the 3 modes
// produce different signatures.
function searchDivergent(opts) {
  const { maxLen, stockMax, weights } = opts;
  const plateMax = PLATES.map(() => stockMax);
  const found = [];
  // Build sequences recursively
  function recur(prefix) {
    if (prefix.length >= 2 && prefix.length <= maxLen) {
      const sigs = ['count', 'kg', 'sqrt'].map(m => {
        const r = algoLib.optimize(prefix.slice(), m, plateMax, PLATES, 20);
        return pathSignature(r);
      });
      if (new Set(sigs).size === 3) {
        found.push({ weights: prefix.slice(), sigs });
        if (found.length >= 5) return true;
      }
    }
    if (prefix.length >= maxLen) return false;
    for (const w of weights) {
      prefix.push(w);
      if (recur(prefix)) return true;
      prefix.pop();
    }
    return false;
  }
  recur([]);
  return found;
}

// ----- run cases -----
function runCase(label, weights, startStack) {
  const plateMax = PLATES.map(() => 2);
  const modes = ['count', 'kg', 'sqrt'];
  const results = {};
  const sigs = {};
  const totals = {};
  for (const m of modes) {
    const r = algoLib.optimize(weights.slice(), m, plateMax, PLATES, 20, startStack);
    results[m] = r;
    sigs[m] = pathSignature(r);
    totals[m] = totalMoves(r);
  }
  const uniqueSigs = new Set(Object.values(sigs)).size;
  const divergent = uniqueSigs === modes.length;
  const someDiffer = uniqueSigs > 1;

  let html = `<div class="case ${divergent ? 'divergent' : someDiffer ? 'converged' : ''}">`;
  html += `<h3>${label}</h3>`;
  html += `<div class="seq">Sequence: <code>${weights.join(', ')} kg</code>${startStack ? ` · start stack: [${startStack.map(i => PLATES[i].label).join(', ')}]` : ''}</div>`;
  html += `<div class="${divergent ? 'pass' : someDiffer ? 'info' : 'info'}">${divergent ? '✓ All 3 modes produce DIFFERENT plate compositions' : someDiffer ? '⚠ Some modes differ (' + uniqueSigs + ' unique outputs)' : '· All 3 modes produce the SAME composition (algorithm convergent for this input)'}</div>`;
  html += '<div class="grid">';
  for (const m of modes) {
    html += `<div class="mode"><div class="name">${m} mode</div>`;
    html += `<pre>${results[m].map(r => r.valid ? `${r.total.toString().padStart(3)} kg → ${stackToCountSummary(r.counts)}` : `${r.total} kg → INVALID`).join('\n')}</pre>`;
    html += `<div class="total"><span>moves <b>${totals[m].moves}</b></span><span>kg <b>${totals[m].kg.toFixed(1)}</b></span><span>Σ√kg <b>${totals[m].sqrtKg.toFixed(2)}</b></span></div>`;
    html += '</div>';
  }
  html += '</div></div>';
  return html;
}

// ----- write output -----
const out = document.getElementById('out');
out.innerHTML += '<h2>Hand-picked cases</h2>';
out.innerHTML += runCase('Simple — straight progression', [60, 80, 100, 120]);
out.innerHTML += runCase('With irregular increments', [60, 75, 95, 115, 130]);
out.innerHTML += runCase('Big set-to-set jumps', [50, 110, 50]);
out.innerHTML += runCase('Starting stack: 2×20 + 1×5 per side', [100, 120, 140], [1, 4, 1]);  // 20kg, 5kg, 20kg ordered
out.innerHTML += runCase('Same sequence, different starting order', [100, 120, 140], [1, 1, 4]); // 20kg, 20kg, 5kg

// ----- brute-force search for divergent sequences -----
out.innerHTML += '<h2>Brute-force search for 3-way divergent inputs</h2>';
const t0 = performance.now();
const found = searchDivergent({ maxLen: 4, stockMax: 2, weights: [40, 50, 60, 70, 80, 90, 100, 110, 120, 130, 140] });
const elapsed = (performance.now() - t0).toFixed(0);
if (found.length === 0) {
  out.innerHTML += `<p class="info">No 3-way divergent sequences found (searched length ≤ 4, ${elapsed} ms). The three modes converge to the same plate composition in this search space.</p>`;
  out.innerHTML += `<p class="info">This is expected: count and sqrt favour fewer/larger plates; kg breaks ties by count. With stock=2 and standard weights, the tie-breakers usually align all three modes.</p>`;
} else {
  out.innerHTML += `<p class="pass">Found ${found.length} divergent sequence(s) in ${elapsed} ms:</p>`;
  for (const f of found) out.innerHTML += runCase('Divergent: ' + f.weights.join(', ') + ' kg', f.weights);
}
</script>
</body>
</html>
