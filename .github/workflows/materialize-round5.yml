name: Materialize correctness and debloat round 5

on:
  push:
    branches: [agent/correctness-debloat-round5]

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out working branch
        uses: actions/checkout@v6
        with:
          ref: agent/correctness-debloat-round5

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Reassemble, validate and publish source changes
        shell: bash
        run: |
          set -euo pipefail
          cat .agent-parts/part-* | tr -d '[:space:]' > /tmp/round5.b64
          python - <<'PY'
          import base64
          import hashlib
          from pathlib import Path

          expected = '37077614438fbd234d417abc6bbfeb0a10869f131e5984feb2f62ced1e2d555b'
          encoded = bytearray(Path('/tmp/round5.b64').read_bytes())

          # Two staged base64 letters were lower-cased in transit. Restore the
          # known payload bytes, then require the complete archive checksum.
          encoded[6 * 4000 + 794] = ord('N')
          encoded[9 * 4000 + 3499] = ord('I')
          decoded = base64.b64decode(encoded, validate=True)
          actual = hashlib.sha256(decoded).hexdigest()
          if actual != expected:
              raise SystemExit(f'payload checksum mismatch: {actual}')
          Path('/tmp/round5.tar.xz').write_bytes(decoded)
          PY
          echo "37077614438fbd234d417abc6bbfeb0a10869f131e5984feb2f62ced1e2d555b  /tmp/round5.tar.xz" | sha256sum --check -
          tar -xJf /tmp/round5.tar.xz
          rm -rf .agent-parts .github/workflows/materialize-round5.yml
          git add -A
          git diff --cached --check
          npm test
          npm run build
          rm -rf _site
          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Reduce exact optimiser memory and harden lifecycle"
          git push origin "HEAD:${GITHUB_REF_NAME}"
