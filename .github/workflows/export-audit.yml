name: Export audit source

on:
  push:
    branches: [agent/bug-debloat-main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out audit branch
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Package source tree
        shell: bash
        run: tar --exclude=.git --exclude=node_modules -czf "$RUNNER_TEMP/plateloader-source.tar.gz" .

      - name: Upload source archive
        uses: actions/upload-artifact@v4
        with:
          name: plateloader-audit-source
          path: ${{ runner.temp }}/plateloader-source.tar.gz
          if-no-files-found: error
          retention-days: 1
