name: Validate audit changes

on:
  push:
    branches: [agent/bug-debloat-main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out working branch
        uses: actions/checkout@v6
        with:
          ref: agent/bug-debloat-main
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Materialize audited patch
        shell: bash
        run: |
          set -euo pipefail
          cat .audit/bin-*.gzpart > /tmp/audit.patch.gz
          python - <<'PY'
          from pathlib import Path
          import gzip
          import hashlib

          data = gzip.decompress(Path('/tmp/audit.patch.gz').read_bytes())
          digest = hashlib.sha256(data).hexdigest()
          expected = 'c3a3560110f93475b502e10969d32108440a666cc3720e0b1b8206dbfaff8ae2'
          if digest != expected:
              raise SystemExit(f'patch digest {digest} != {expected}')
          Path('/tmp/audit.patch').write_bytes(data)
          PY
          git apply --check /tmp/audit.patch
          git apply /tmp/audit.patch
          rm -rf .audit
          rm -f .github/workflows/export-audit.yml
          rm -f .github/workflows/validate-audit.yml
          git diff --check

      - name: Install and lock browser dependency
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Run unit and build regression tests
        run: npm test

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run browser and PWA checks
        run: npm run test:browser

      - name: Commit validated source tree
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          for name in ('playwright.config.js', 'tests/browser.spec.js', 'tests/serve-site.js'):
              path = Path(name)
              path.write_text(path.read_text().rstrip('\n') + '\n')
          PY
          git config user.name "senegrom"
          git config user.email "6349874+senegrom@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git status --short
          git commit -m "Audit and debloat Plate Loader"
          git push origin HEAD:agent/bug-debloat-main
