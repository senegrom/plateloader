name: Validate round 2 audit fixes

on:
  push:
    branches: [agent/scan-debloat-round2]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out audit branch
        uses: actions/checkout@v6
        with:
          ref: agent/scan-debloat-round2
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Materialize audited patch
        shell: bash
        run: |
          set -euo pipefail
          base64 --decode .audit/round2.patch.gz.b64 | gzip --decompress > /tmp/round2.patch
          echo "095125765649afd0aaf6bf1db445fa917afb7d0134631381b90d671750850dc9  /tmp/round2.patch" | sha256sum --check
          if git apply --check /tmp/round2.patch; then
            git apply /tmp/round2.patch
            echo "PATCH_APPLIED=true" >> "$GITHUB_ENV"
          elif git apply --reverse --check /tmp/round2.patch; then
            echo "PATCH_APPLIED=false" >> "$GITHUB_ENV"
          else
            echo "Patch is neither applicable nor already present" >&2
            exit 1
          fi
          git diff --check

      - name: Install browser test dependency
        if: env.PATCH_APPLIED == 'true'
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Run unit and build regression tests
        if: env.PATCH_APPLIED == 'true'
        run: npm test

      - name: Install Chromium
        if: env.PATCH_APPLIED == 'true'
        run: npx playwright install --with-deps chromium

      - name: Run browser and PWA checks
        if: env.PATCH_APPLIED == 'true'
        run: npm run test:browser

      - name: Commit validated application changes
        if: env.PATCH_APPLIED == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "senegrom"
          git config user.email "6349874+senegrom@users.noreply.github.com"
          git add \
            algo.js plateloader.css plateloader.js state.js \
            tests/algo.test.js tests/assets.test.js \
            tests/browser.spec.js tests/state.test.js
          git diff --cached --check
          git commit -m "Harden persisted state and trim dead runtime code"
          git push origin HEAD:agent/scan-debloat-round2
