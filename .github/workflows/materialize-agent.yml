name: Materialize Plate Loader fixes

on:
  push:
    branches:
      - agent/harden-cache-input-and-debloat

permissions:
  contents: write

concurrency:
  group: materialize-plateloader-fixes
  cancel-in-progress: true

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out agent branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name }}

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Materialize, validate and commit the audited source tree
        shell: bash
        run: |
          set -euo pipefail
          cat .agent-parts/part-* > /tmp/plateloader-update.b64
          base64 --decode /tmp/plateloader-update.b64 > /tmp/plateloader-update.tar.gz
          echo "01e9cc465d2d2bacfe35ff9ad7f3e250911dc685567d47f86c805ef6883a5ceb  /tmp/plateloader-update.tar.gz" | sha256sum --check -
          tar -xzf /tmp/plateloader-update.tar.gz
          rm -rf .agent-parts .github/workflows/materialize-agent.yml
          rm -f plateloader-test.html
          git add -A
          git diff --cached --check
          npm test
          npm run build
          rm -rf _site
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Harden caching, input handling and app shell"
          git push origin "HEAD:${GITHUB_REF_NAME}"
